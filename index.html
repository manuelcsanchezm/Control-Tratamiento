<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1680b8">
<title>Control de Tratamiento</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tratamiento">
<style>
:root{
  --bg:#f1f7fb; --surf:#ffffff; --surf2:#e7f1f8; --line:#d8e7f1; --line2:#b6d1e2;
  --tx:#13293a; --tx2:#4d6779; --tx3:#7c94a6;
  --ac:#1680b8; --ac-tx:#11648f; --ac-soft:#e1f1fa;
  --ac2:#0eb3a6; --ac2-soft:#d9f6f3;
  --ac3:#f5821f; --ac3-soft:#ffeedc;
  --ok:#1aa06a; --ok-soft:#dbf5e8;
  --wa:#d9811a; --wa-soft:#fdefdb;
  --cr:#d94f3d; --cr-soft:#fde7e4;
  --sh:0 1px 2px rgba(19,41,58,.05), 0 3px 14px rgba(19,41,58,.06);
  --sh2:0 4px 18px rgba(22,128,184,.18);
  --r:16px;
  --serif:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a24; --surf:#16242f; --surf2:#1e303d; --line:#2a3f4f; --line2:#3b5568;
    --tx:#e9f2f8; --tx2:#a0b6c6; --tx3:#7a93a5;
    --ac:#4cb3e6; --ac-tx:#80cdf2; --ac-soft:#13303f;
    --ac2:#2fd6c6; --ac2-soft:#0f3330;
    --ac3:#ffa552; --ac3-soft:#38270f;
    --ok:#4fd49d; --ok-soft:#113327;
    --wa:#f0ad5c; --wa-soft:#33260f;
    --cr:#f08478; --cr-soft:#3a1f1c;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 3px 14px rgba(0,0,0,.25);
    --sh2:0 4px 18px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a24; --surf:#16242f; --surf2:#1e303d; --line:#2a3f4f; --line2:#3b5568;
  --tx:#e9f2f8; --tx2:#a0b6c6; --tx3:#7a93a5;
  --ac:#4cb3e6; --ac-tx:#80cdf2; --ac-soft:#13303f;
  --ac2:#2fd6c6; --ac2-soft:#0f3330;
  --ac3:#ffa552; --ac3-soft:#38270f;
  --ok:#4fd49d; --ok-soft:#113327;
  --wa:#f0ad5c; --wa-soft:#33260f;
  --cr:#f08478; --cr-soft:#3a1f1c;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 3px 14px rgba(0,0,0,.25);
  --sh2:0 4px 18px rgba(0,0,0,.4);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{color-scheme:light dark;}
img{max-width:100%;}
[hidden]{display:none!important;}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);
  font-size:15px;line-height:1.5;margin:0;
  padding-block:0 calc(74px + env(safe-area-inset-bottom));padding-inline:16px;}
.wrap{max-width:720px;margin:0 auto;}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px;}
.num{font-variant-numeric:tabular-nums;}

header{padding-block:calc(14px + env(safe-area-inset-top)) 12px;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
header h1{font-size:20px;font-weight:600;letter-spacing:-.2px;}
header .pac{color:var(--tx2);font-size:14px;}
.hbtn{margin-left:auto;display:flex;gap:6px;}
.hbtn button{background:var(--surf);border:1px solid var(--line);border-radius:99px;
  width:32px;height:32px;display:grid;place-items:center;color:var(--tx2);padding:0;}
.hbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);margin-bottom:12px;}
.card-h{padding:11px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card-h h2{font-size:15px;font-weight:600;}
.card-h .sub{color:var(--tx3);font-size:12.5px;margin-left:auto;}
.card-b{padding:14px;}

.toma{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
.toma:last-child{border-bottom:none;}
.toma .hora{font-size:16px;font-weight:600;min-width:52px;}
.toma .med{flex:1;min-width:0;}
.toma .med .n{font-weight:600;}
.toma .med .d{color:var(--tx2);font-size:13px;}
.toma .med .quien{color:var(--ok);font-size:12.5px;margin-top:1px;}
.btn-toma{border:1.5px solid var(--line2);background:var(--surf);border-radius:99px;
  padding:9px 17px;font-size:13.5px;font-weight:700;white-space:nowrap;
  transition:transform .15s ease;}
.btn-toma:active{transform:scale(.93);}
.btn-toma[data-on="1"]{animation:pop .4s ease;}
.btn-toma[data-on="1"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}

.franja{display:flex;gap:1px;background:var(--line);border-radius:7px;overflow:hidden;margin-top:12px;}
.franja div{flex:1;height:8px;background:var(--surf2);}
.franja div[data-s="ok"]{background:var(--ok);}
.franja div[data-s="pa"]{background:var(--wa);}
.franja div[data-s="no"]{background:var(--cr);}
.franja-lbl{display:flex;justify-content:space-between;gap:8px;color:var(--tx3);
  font-size:11.5px;margin-top:5px;}

.mets{display:flex;gap:10px;flex-wrap:wrap;}
.met{flex:1;min-width:118px;background:var(--surf2);border-radius:8px;padding:10px 12px;}
.met .k{color:var(--tx2);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;}
.met .v{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.2;margin-top:2px;}
.met .v small{font-size:13px;font-weight:400;color:var(--tx2);font-family:var(--sans);}

.ex{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.ex:last-child{border-bottom:none;}
.ex .f{color:var(--tx2);font-size:13px;min-width:74px;}
.ex .val{font-family:var(--serif);font-size:19px;font-weight:600;min-width:58px;}
.ex .det{flex:1;color:var(--tx3);font-size:12.5px;min-width:100px;}
.pill{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
  padding:2px 8px;border-radius:99px;white-space:nowrap;}
.pill[data-z="bajo"]{background:var(--cr-soft);color:var(--cr);}
.pill[data-z="rango"]{background:var(--ok-soft);color:var(--ok);}
.pill[data-z="alto"]{background:var(--wa-soft);color:var(--wa);}

.graf{padding:14px 10px 6px;}
.graf svg{display:block;width:100%;height:auto;max-width:100%;}
.leg{display:flex;gap:14px;flex-wrap:wrap;color:var(--tx2);font-size:12px;padding:0 14px 12px;}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px;}

.fila{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.campo{flex:1;min-width:132px;}
label{display:block;color:var(--tx2);font-size:12.5px;margin-bottom:3px;}
input,select{width:100%;background:var(--surf);color:var(--tx);border:1px solid var(--line2);
  border-radius:12px;padding:10px 11px;font:inherit;}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:11px;color:var(--tx2);font-size:13.5px;}
.chk input{width:auto;}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;
  border-radius:13px;padding:11px 19px;font-weight:700;font-size:14px;
  box-shadow:var(--sh2);transition:transform .15s ease;}
.btn:active{transform:scale(.96);}
.btn.sec{background:var(--surf);color:var(--ac-tx);border:1.5px solid var(--line2);box-shadow:none;}
.btn.peli{background:var(--surf);color:var(--cr);border:1.5px solid var(--cr);box-shadow:none;}
.btn:disabled{opacity:.5;cursor:default;}
.btns{display:flex;gap:8px;flex-wrap:wrap;}
.btn-x{background:none;border:none;color:var(--tx3);font-size:19px;padding:2px 7px;line-height:1;}

.res{background:var(--surf2);border-radius:8px;padding:14px;font-size:13.5px;
  line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;}
.nota{background:var(--ac-soft);border-left:3px solid var(--ac);padding:9px 12px;
  border-radius:0 7px 7px 0;font-size:13px;color:var(--ac-tx);margin-bottom:12px;}
.vacio{color:var(--tx3);text-align:center;padding:26px 14px;font-size:14px;}
.aviso{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(86px + env(safe-area-inset-bottom));
  background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;
  font-weight:600;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:calc(100% - 32px);}

/* ---------- instalación ---------- */
.inst{background:var(--ac-soft);border:1px solid var(--ac);border-radius:var(--r);
  padding:13px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;}
.inst svg{flex:0 0 auto;width:26px;height:26px;fill:none;stroke:var(--ac-tx);
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-top:1px;}
.inst .c{flex:1;min-width:0;}
.inst .t{font-weight:650;color:var(--ac-tx);margin-bottom:2px;}
.inst p{margin:0 0 9px;font-size:13.3px;color:var(--ac-tx);}
.inst .pasos{margin:0 0 9px;padding-left:18px;font-size:13.3px;color:var(--ac-tx);}
.inst .pasos li{margin-bottom:2px;}
.inst kbd{background:var(--surf);border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:4px;padding:0 5px;font-size:12.5px;font-family:inherit;white-space:nowrap;}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);
  display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;background:none;border:none;padding:10px 4px 12px;color:var(--tx3);
  font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;
  border-top:2px solid transparent;margin-top:-1px;}
nav button[aria-selected="true"]{color:var(--ac-tx);border-top-color:var(--ac);}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;}
@media(min-width:620px){
  body{padding-block:0 28px;}
  nav{position:static;border-top:none;border-bottom:1px solid var(--line);background:transparent;
    max-width:720px;margin:0 auto 14px;padding-bottom:0;}
  nav button{flex:0 0 auto;flex-direction:row;padding:8px 15px;font-size:13.5px;
    border-top:none;border-bottom:2px solid transparent;margin-top:0;}
  nav button[aria-selected="true"]{border-bottom-color:var(--ac);}
  .aviso{bottom:28px;}
}
/* ===================== animación ===================== */
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes flota{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
@keyframes onda{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes brilla{0%{background-position:-180% 0}100%{background-position:180% 0}}
@keyframes saluda{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(13deg)}90%{transform:rotate(-9deg)}}


/* ===================== semana: círculos por día ===================== */
.semana{display:flex;gap:4px;padding:4px 2px 2px;}
.dia{flex:1;min-width:0;text-align:center;}
.dia .dl{font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;
  letter-spacing:.3px;margin-bottom:5px;}
.dia .db{position:relative;margin:0 auto;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;border:2px solid var(--line2);background:var(--surf2);
  color:var(--tx3);font-weight:700;font-size:13px;transition:transform .18s ease;}
.dia .db svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;
  stroke-linecap:round;stroke-linejoin:round;}
.dia[data-s="ok"] .db{background:var(--ok);border-color:var(--ok);color:#fff;}
.dia[data-s="pa"] .db{background:var(--wa-soft);border-color:var(--wa);color:var(--wa);}
.dia[data-s="no"] .db{background:var(--cr-soft);border-color:var(--cr);color:var(--cr);}
.dia[data-hoy="1"] .db{box-shadow:0 0 0 3px var(--surf),0 0 0 5px var(--ac);}
.dia[data-hoy="1"] .dl{color:var(--ac-tx);}
.dia[data-nuevo="1"] .db{animation:pop .45s ease;}

/* ===================== cabecera alegre ===================== */
.hero{display:flex;align-items:center;gap:13px;background:
  linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);
  border-radius:var(--r);padding:15px 17px;margin-bottom:12px;color:#fff;
  box-shadow:var(--sh2);}
.hero .ht{flex:1;min-width:0;}
.hero .h1{font-size:17px;font-weight:700;letter-spacing:-.2px;}
.hero .h2{font-size:13.2px;opacity:.93;margin-top:2px;}
.hero .ico{flex:0 0 auto;width:52px;height:52px;position:relative;display:grid;place-items:center;}
.hero .ico .o{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0;
  animation:onda 2.4s ease-out infinite;}
.hero .ico .o:nth-child(2){animation-delay:.8s}
.hero .ico svg{width:30px;height:30px;position:relative;animation:flota 3.6s ease-in-out infinite;}
.hero .pct{flex:0 0 auto;text-align:center;}
.hero .pct b{display:block;font-size:24px;font-weight:800;line-height:1;}
.hero .pct span{font-size:10.5px;opacity:.9;text-transform:uppercase;letter-spacing:.4px;}

/* ===================== ánimo ===================== */
.animo{display:flex;gap:7px;padding:4px 0 2px;}
.animo button{flex:1;min-width:0;background:var(--surf2);border:2px solid transparent;
  border-radius:14px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;}
.animo button svg{width:34px;height:34px;}
.animo button .et{font-size:10.5px;font-weight:600;color:var(--tx3);}
.animo button:active{transform:scale(.93);}
.animo button[aria-pressed="true"]{background:var(--ac-soft);border-color:var(--ac);}
.animo button[aria-pressed="true"] .et{color:var(--ac-tx);}
.animo button[aria-pressed="true"] svg{animation:pop .4s ease;}

/* ===================== síntomas ===================== */
.sint{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.sint:last-of-type{border-bottom:none;}
.sint .sn{flex:1;min-width:104px;font-weight:600;font-size:14px;}
.niv{display:flex;gap:5px;}
.niv button{width:40px;height:32px;border-radius:9px;border:1.5px solid var(--line2);
  background:var(--surf);color:var(--tx3);font-size:11.5px;font-weight:700;
  transition:transform .14s ease;}
.niv button:active{transform:scale(.9);}
.niv button[aria-pressed="true"]{color:#fff;border-color:transparent;animation:pop .35s ease;}
.niv button[data-n="0"][aria-pressed="true"]{background:var(--ok);}
.niv button[data-n="1"][aria-pressed="true"]{background:var(--ac2);}
.niv button[data-n="2"][aria-pressed="true"]{background:var(--wa);}
.niv button[data-n="3"][aria-pressed="true"]{background:var(--cr);}

/* ===================== racha / logro ===================== */
.racha{display:flex;align-items:center;gap:11px;background:var(--ac3-soft);
  border:1px solid var(--ac3);border-radius:var(--r);padding:11px 14px;margin-bottom:12px;}
.racha svg{flex:0 0 auto;width:26px;height:26px;animation:saluda 3.2s ease-in-out infinite;}
.racha .rt{flex:1;min-width:0;font-size:13.5px;color:var(--tx);}
.racha .rt b{color:var(--ac3);}

/* ===================== ilustración de vacío ===================== */
.ilus{display:block;margin:0 auto 10px;width:118px;height:auto;}
.ilus .fl{animation:flota 4.2s ease-in-out infinite;transform-origin:center;}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Control de Tratamiento</h1>
    <span class="pac" id="pac"></span>
    <span class="hbtn">
      <button id="b-tema" title="Cambiar tema" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </span>
  </header>
</div>

<nav role="tablist">
  <button role="tab" aria-selected="true" data-v="hoy">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3 7-7"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    Hoy</button>
  <button role="tab" aria-selected="false" data-v="dia">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 007 0"/>
      <path d="M9 9.5v.01M15 9.5v.01"/></svg>
    Diario</button>
  <button role="tab" aria-selected="false" data-v="ex">
    <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 5-7 4 5"/><path d="M3 21h18"/></svg>
    Exámenes</button>
  <button role="tab" aria-selected="false" data-v="res">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
    Resumen</button>
  <button role="tab" aria-selected="false" data-v="cfg">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
    Ajustes</button>
</nav>

<div class="wrap"><main id="main"></main></div>
<input type="file" id="fimport" accept="application/json,.json" hidden>

<script>
"use strict";

/* ===================== almacenamiento (IndexedDB) ===================== */
const DB_NAME = "control-tratamiento-db", DB_VER = 2;
const STORES = ["config", "tomas", "examenes", "diario"];
let _db = null;

function abrirDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      for(const s of STORES) if(!d.objectStoreNames.contains(s)) d.createObjectStore(s);
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
function idbOp(store, modo, fn){
  return new Promise((res, rej) => {
    const t = _db.transaction(store, modo);
    const req = fn(t.objectStore(store));
    t.onerror = () => rej(t.error);
    if(req) req.onsuccess = () => res(req.result); else t.oncomplete = () => res();
  });
}
const idbGet  = (s,k)   => idbOp(s, "readonly",  o => o.get(k));
const idbSet  = (s,k,v) => idbOp(s, "readwrite", o => o.put(v, k));
const idbDel  = (s,k)   => idbOp(s, "readwrite", o => o.delete(k));
const idbKeys = s       => idbOp(s, "readonly",  o => o.getAllKeys());
const idbVals = s       => idbOp(s, "readonly",  o => o.getAll());
const idbClear= s       => idbOp(s, "readwrite", o => o.clear());

/* ===================== estado ===================== */
const SINT_DEF = [
  { id:"s1", nombre:"Náuseas" },
  { id:"s2", nombre:"Temblor" },
  { id:"s3", nombre:"Mucha sed" },
  { id:"s4", nombre:"Sueño / cansancio" },
  { id:"s5", nombre:"Dolor de cabeza" }
];
const CFG_DEF = { paciente:"", unidad:"mEq/L", rango:{min:0.6,max:1.2}, medicamentos:[],
                  sintomas:[...SINT_DEF], recordatorios:false };
const S = { vista:"hoy", cfg:{...CFG_DEF}, tomas:{}, examenes:[], diario:{}, quien:"", listo:false };

/* ánimo: 1 = muy mal … 5 = muy bien */
const ANIMOS = [
  { n:1, et:"Mal",      c:"var(--cr)",  boca:"M8.6 15.6a4.4 4.4 0 016.8 0", ceja:1 },
  { n:2, et:"Regular",  c:"var(--wa)",  boca:"M8.8 15.1a4.2 4.2 0 016.4-.6", ceja:0 },
  { n:3, et:"Normal",   c:"var(--tx3)", boca:"M8.7 14.6h6.6", ceja:0 },
  { n:4, et:"Bien",     c:"var(--ac2)", boca:"M8.6 13.6a4.4 4.4 0 006.8 0", ceja:0 },
  { n:5, et:"Muy bien", c:"var(--ok)",  boca:"M8 13a5 5 0 008 0", ceja:2 }
];
/* carita SVG; ojos cerrados y arqueados en el nivel más alto */
function caraSVG(a, tam){
  const t = tam || 34;
  const ojos = a.ceja === 2
    ? `<path d="M8.6 10.6a1.7 1.7 0 012.8 0M12.6 10.6a1.7 1.7 0 012.8 0"/>`
    : `<path d="M9.7 10.4v.01M14.3 10.4v.01" stroke-width="2.4"/>`;
  const cejas = a.ceja === 1 ? `<path d="M8.2 7.9l2.6 1.1M15.8 7.9l-2.6 1.1" stroke-width="1.5"/>` : "";
  return `<svg viewBox="0 0 24 24" width="${t}" height="${t}" aria-hidden="true"
    fill="none" stroke="${a.c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.2" fill="none"/>${cejas}${ojos}<path d="${a.boca}"/></svg>`;
}
const animoDe = n => ANIMOS.find(a => a.n === n) || null;
const NIV_ET = ["Nada","Poco","Medio","Harto"];

/* ---------- dibujos ---------- */
/* cápsula flotando con sus ondas, igual que el ícono de la app */

    <g stroke="var(--ac)" fill="none" stroke-width="3" stroke-linecap="round" opacity=".32">

      <rect x="40" y="26" width="40" height="68" rx="20" fill="none" stroke="var(--surf)" stroke-width="2.5"/>
      <path d="M40 60h40" stroke="var(--surf)" stroke-width="2.5"/>

/* cuadernito del diario */
function ilusDiario(){

      <rect x="28" y="22" width="64" height="78" rx="9" fill="var(--ac-soft)" stroke="var(--ac)" stroke-width="3"/>
      <path d="M44 22v78" stroke="var(--ac)" stroke-width="3"/>
      <g stroke="var(--ac)" stroke-width="3.4" stroke-linecap="round" opacity=".55">

/* ===================== utilidades ===================== */
const dosDig = n => String(n).padStart(2,"0");
const aISO   = d => d.getFullYear()+"-"+dosDig(d.getMonth()+1)+"-"+dosDig(d.getDate());
const hoyISO = () => aISO(new Date());
const diaISO = n => { const d = new Date(); d.setDate(d.getDate()-n); return aISO(d); };
const fmtF   = iso => { if(!iso) return "—"; const p = iso.split("-"); return p[2]+"-"+p[1]; };
const fmtFL  = iso => { if(!iso) return "—"; const p = iso.split("-"); return p[2]+"-"+p[1]+"-"+p[0]; };
const nHoy   = () => { const d = new Date(); return dosDig(d.getHours())+":"+dosDig(d.getMinutes()); };
const esc    = s => String(s==null?"":s).replace(/[&<>"']/g, c =>
                 ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nuevoId= () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- instalación en el teléfono ---------- */
let promptInstalar = null;
const DESCARTE = "tratamiento-inst-no";

const yaInstalada = () =>
  matchMedia("(display-mode: standalone)").matches ||
  matchMedia("(display-mode: fullscreen)").matches ||
  navigator.standalone === true;
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const descartado = () => { try { return localStorage.getItem(DESCARTE) === "1"; } catch(_){ return false; } };

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  promptInstalar = e;
  render();
});
window.addEventListener("appinstalled", () => {
  promptInstalar = null;
  try { localStorage.removeItem(DESCARTE); } catch(_){ }
  render();
  aviso("Listo: ya quedó en tu pantalla de inicio");
});

/* El aviso de arriba en «Hoy»; en Ajustes vive la versión completa */
function bannerInstalar(){
  if(yaInstalada() || descartado()) return "";
  if(!promptInstalar && !esIOS()) return "";
  const icono = `<svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/>
      <path d="M12 7v7"/><path d="M9 11l3 3 3-3"/></svg>`;
  if(promptInstalar) return `<div class="inst">${icono}<div class="c">
      <div class="t">Déjala en tu pantalla de inicio</div>
      <p>Queda con su propio ícono, se abre a pantalla completa y funciona sin internet.</p>
      <div class="btns"><button class="btn" id="i-add">Instalar app</button>
        <button class="btn sec" id="i-no">Ahora no</button></div></div></div>`;
  return `<div class="inst">${icono}<div class="c">
      <div class="t">Déjala en tu pantalla de inicio</div>
      <ol class="pasos"><li>Toca <kbd>Compartir</kbd> abajo en Safari.</li>
        <li>Elige <kbd>Agregar a inicio</kbd>.</li></ol>
      <div class="btns"><button class="btn sec" id="i-no">Entendido</button></div></div></div>`;
}

function zona(v){ const r = S.cfg.rango; if(v < r.min) return "bajo"; if(v > r.max) return "alto"; return "rango"; }
function zonaTxt(z){ return z==="bajo" ? "bajo rango" : z==="alto" ? "sobre rango" : "en rango"; }

let avisoT = null;
function aviso(txt){
  let el = document.querySelector(".aviso");
  if(!el){ el = document.createElement("div"); el.className = "aviso"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = txt;
  clearTimeout(avisoT);
  avisoT = setTimeout(() => el.remove(), 2600);
}

/* tomas esperadas de un día, ordenadas por hora */
function esperadas(){
  const out = [];
  for(const m of S.cfg.medicamentos)
    for(const h of (m.horarios || []))
      out.push({ medId:m.id, nombre:m.nombre, dosis:m.dosis, hora:h, key:m.id+"|"+h });
  return out.sort((a,b) => a.hora.localeCompare(b.hora));
}
function regsDe(f){ return (S.tomas[f] && S.tomas[f].registros) || {}; }

function adherencia(n){
  const esp = esperadas(); if(!esp.length) return null;
  let tot = 0, hechas = 0;
  for(let i=1; i<=n; i++){
    const r = regsDe(diaISO(i));
    for(const e of esp){ tot++; if(r[e.key] && r[e.key].tomada) hechas++; }
  }
  return tot ? { tot, hechas, pct: Math.round(hechas*100/tot) } : null;
}

/* ---------- diario: ánimo y síntomas ---------- */
const DIA_DEF = { animo:null, sintomas:{}, nota:"" };
function diaDe(f){ return S.diario[f] || { fecha:f, ...DIA_DEF, sintomas:{} }; }

/* días seguidos (hasta ayer) con todas las tomas marcadas */
function racha(){
  const esp = esperadas(); if(!esp.length) return 0;
  let n = 0;
  for(let i = 1; i <= 60; i++){
    const r = regsDe(diaISO(i));
    if(esp.every(e => r[e.key] && r[e.key].tomada)) n++; else break;
  }
  return n;
}

/* fila de los últimos 7 días, con el círculo de cada uno */
function semana(){
  const esp = esperadas();
  const L = ["D","L","M","M","J","V","S"];
  const chulo = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg>`;
  let out = "";
  for(let i = 6; i >= 0; i--){
    const fd = diaISO(i), rr = regsDe(fd), d = new Date(fd + "T12:00:00");
    const n = esp.filter(e => rr[e.key] && rr[e.key].tomada).length;
    const comp = esp.length && n === esp.length;
    const s = comp ? "ok" : n > 0 ? "pa" : (i === 0 ? "" : "no");
    out += `<div class="dia" data-s="${s}" data-hoy="${i===0?1:0}" data-nuevo="${comp&&i===0?1:0}"
        title="${fmtFL(fd)}: ${n} de ${esp.length}">
      <div class="dl">${L[d.getDay()]}</div>
      <div class="db">${comp ? chulo : (n > 0 ? n : (i===0 ? "·" : "–"))}</div>
    </div>`;
  }
  return `<div class="semana">${out}</div>`;
}

/* ===================== vista: Hoy ===================== */
function vHoy(){
  const esp = esperadas(), f = hoyISO(), r = regsDe(f);
  if(!esp.length) return `<div class="card"><div class="card-b vacio">
      ${ilusPastilla()}
      Todavía no hay medicamentos configurados.<br>
      Agrégalos en <b>Ajustes</b> para empezar a registrar las tomas.</div></div>`;

  const hechas = esp.filter(e => r[e.key] && r[e.key].tomada).length;
  const filas = esp.map(e => {
    const t = r[e.key], on = t && t.tomada;
    return `<div class="toma">
      <div class="hora num">${esc(e.hora)}</div>
      <div class="med">
        <div class="n">${esc(e.nombre)}</div>
        <div class="d num">${esc(e.dosis)}</div>
        ${on ? `<div class="quien">Marcada ${esc(t.horaReal||"")}${t.porNombre ? " · "+esc(t.porNombre) : ""}</div>` : ""}
      </div>
      <button class="btn-toma" data-on="${on?1:0}" data-k="${esc(e.key)}">${on ? "✓ Tomada" : "Marcar"}</button>
    </div>`;
  }).join("");

  let franja = "";
  for(let i=13; i>=0; i--){
    const fd = diaISO(i), rr = regsDe(fd);
    const n = esp.filter(e => rr[e.key] && rr[e.key].tomada).length;
    const s = n === esp.length ? "ok" : n > 0 ? "pa" : (i === 0 ? "" : "no");
    franja += `<div data-s="${s}" title="${fmtFL(fd)}: ${n} de ${esp.length}"></div>`;
  }
  const ad = adherencia(14);
  const falta = esp.length - hechas;
  const pctHoy = Math.round(hechas*100/esp.length);

  const hero = `<div class="hero">
    <div class="ico"><span class="o"></span><span class="o"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="7.5" y="2.5" width="9" height="19" rx="4.5"/><path d="M7.5 12h9"/></svg></div>
    <div class="ht">
      <div class="h1">${falta === 0 ? "¡Día completo!" : falta === esp.length ? "Partamos el día" : "Vas bien"}</div>
      <div class="h2">${falta === 0
        ? "Marcaste todas las tomas de hoy."
        : falta === 1 ? "Queda 1 toma por marcar." : "Quedan " + falta + " tomas por marcar."}</div>
    </div>
    <div class="pct"><b class="num">${pctHoy}%</b><span>hoy</span></div>
  </div>`;

  const r7 = racha();
  const estrella = `<svg viewBox="0 0 24 24" fill="var(--ac3)" aria-hidden="true">
    <path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.45 6.19 20.5 7.3 14.03 2.6 9.45l6.5-.95z"/></svg>`;
  const rachaHTML = r7 >= 2
    ? `<div class="racha">${estrella}<div class="rt"><b>${r7} días seguidos</b> sin saltarte ninguna toma. Sigue así.</div></div>`
    : "";

  return hero + rachaHTML + `<div class="card">
    <div class="card-h"><h2>Tomas de hoy</h2><span class="sub num">${hechas} de ${esp.length}</span></div>
    ${filas}
    <div class="card-b" style="padding-top:8px;">
      ${semana()}
      <div class="franja">${franja}</div>
      <div class="franja-lbl">
        <span class="num">${fmtFL(diaISO(13))}</span>
        <span>${ad ? ad.pct+"% en 14 días" : ""}</span>
        <span class="num">${fmtFL(hoyISO())}</span>
      </div>
    </div></div>` + recordatorioDiario() + ultimoExamen();
}

function ultimoExamen(){
  if(!S.examenes.length) return "";
  const e = S.examenes[0], z = zona(e.valor);
  const dias = Math.round((new Date(hoyISO()) - new Date(e.fecha)) / 86400000);
  return `<div class="card">
    <div class="card-h"><h2>Último examen</h2>
      <span class="sub">${dias===0 ? "hoy" : dias===1 ? "ayer" : "hace "+dias+" días"}</span></div>
    <div class="card-b"><div class="mets">
      <div class="met"><div class="k">Valor</div>
        <div class="v num">${e.menorQue ? "&lt; " : ""}${e.valor} <small>${esc(S.cfg.unidad)}</small></div></div>
      <div class="met"><div class="k">Rango esperado</div>
        <div class="v num" style="font-size:19px;">${S.cfg.rango.min} – ${S.cfg.rango.max}</div></div>
      <div class="met"><div class="k">Situación</div>
        <div class="v" style="font-size:16px;padding-top:4px;">
          <span class="pill" data-z="${z}">${zonaTxt(z)}</span></div></div>
    </div></div></div>`;
}

/* tarjetita en «Hoy» que invita a llenar el diario si aún no se hizo */
function recordatorioDiario(){
  const d = diaDe(hoyISO());
  if(d.animo) return "";
  return `<div class="card"><div class="card-b" style="display:flex;align-items:center;gap:12px;">
    <div style="flex:1;min-width:0;">
      <div style="font-weight:700;margin-bottom:2px;">¿Cómo te sentiste hoy?</div>
      <div style="color:var(--tx2);font-size:13.3px;">
        Anótalo en el diario. Así el médico ve si algo te cae mal.</div>
    </div>
    <button class="btn" data-ir="dia">Anotar</button>
  </div></div>`;
}

/* ===================== vista: Diario ===================== */
function vDiario(){
  const f = hoyISO(), d = diaDe(f);
  const sints = S.cfg.sintomas || [];

  const caras = ANIMOS.map(a => `<button data-animo="${a.n}" aria-pressed="${d.animo===a.n}"
      title="${a.et}">${caraSVG(a)}<span class="et">${a.et}</span></button>`).join("");

  const filasS = sints.length ? sints.map(s => {
    const n = d.sintomas[s.id];
    const bot = NIV_ET.map((et,i) => `<button data-sint="${esc(s.id)}" data-n="${i}"
        aria-pressed="${n===i}" title="${et}">${et}</button>`).join("");
    return `<div class="sint"><div class="sn">${esc(s.nombre)}</div><div class="niv">${bot}</div></div>`;
  }).join("") : `<div class="card-b vacio" style="padding:18px 14px;">
      Sin síntomas configurados. Agrégalos en <b>Ajustes</b>.</div>`;

  const hoyCard = `<div class="card">
    <div class="card-h"><h2>¿Cómo te sientes hoy?</h2>
      <span class="sub num">${fmtFL(f)}</span></div>
    <div class="card-b"><div class="animo">${caras}</div></div></div>

    <div class="card"><div class="card-h"><h2>¿Sentiste algo de esto?</h2>
      <span class="sub">toca el nivel</span></div>
    ${filasS}</div>

    <div class="card"><div class="card-h"><h2>¿Algo más que contar?</h2></div>
    <div class="card-b">
      <div class="fila"><div class="campo">
        <input type="text" id="d-nota" value="${esc(d.nota)}"
          placeholder="Me dolió la guata después del almuerzo…"></div></div>
      <button class="btn" id="d-nota-save">Guardar nota</button>
    </div></div>`;

  return hoyCard + graficoAnimo() + historialDiario();
}

/* gráfico del ánimo de los últimos 14 días */
function graficoAnimo(){
  const dias = [];
  for(let i=13; i>=0; i--){ const f = diaISO(i); dias.push({ f, d: S.diario[f] }); }
  if(!dias.some(x => x.d && x.d.animo))
    return `<div class="card"><div class="card-b vacio">${ilusDiario()}
      Cuando lleves unos días anotando, acá vas a ver cómo te has sentido.</div></div>`;

  const W=640, H=190, mL=30, mR=16, mT=16, mB=30;
  const iw = W-mL-mR, ih = H-mT-mB;
  const Y = v => mT + ih - ((v-1)/4)*ih;
  const X = i => mL + (i/(dias.length-1))*iw;

  let ticks = "";
  for(const a of ANIMOS)
    ticks += `<line x1="${mL}" y1="${Y(a.n)}" x2="${W-mR}" y2="${Y(a.n)}" stroke="var(--line)" stroke-width="1"/>`;

  const pts = dias.map((x,i) => ({ i, n: x.d && x.d.animo ? x.d.animo : null })).filter(p => p.n);
  let linea = "";
  for(let k=1; k<pts.length; k++){
    if(pts[k].i - pts[k-1].i === 1)
      linea += `<line x1="${X(pts[k-1].i)}" y1="${Y(pts[k-1].n)}" x2="${X(pts[k].i)}" y2="${Y(pts[k].n)}"
        stroke="var(--ac)" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  const puntos = pts.map(p => {
    const a = animoDe(p.n);
    return `<circle cx="${X(p.i)}" cy="${Y(p.n)}" r="5" fill="${a.c}" stroke="var(--surf)" stroke-width="2"/>`;
  }).join("");
  const fechas = dias.map((x,i) => (i % 3 === 0 || i === dias.length-1)
    ? `<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--tx3)">${fmtF(x.f)}</text>` : "").join("");

  return `<div class="card">
    <div class="card-h"><h2>Cómo te has sentido</h2>
      <span class="sub num">${fmtFL(diaISO(13))} – ${fmtFL(hoyISO())}</span></div>
    <div class="graf"><svg viewBox="0 0 ${W} ${H}" role="img"
        aria-label="Estado de ánimo de los últimos 14 días">
      ${ticks}${linea}${puntos}${fechas}
    </svg></div>
    <div class="leg">${ANIMOS.map(a =>
      `<span><i style="background:${a.c};"></i>${a.et}</span>`).join("")}</div></div>`;
}

/* últimos días con algo anotado */
function historialDiario(){
  const fs = Object.keys(S.diario).sort().reverse().slice(0, 14)
    .filter(f => { const d = S.diario[f]; return d && (d.animo || d.nota || Object.keys(d.sintomas||{}).some(k => d.sintomas[k] > 0)); });
  if(!fs.length) return "";

  const filas = fs.map(f => {
    const d = S.diario[f], a = animoDe(d.animo);
    const cons = Object.entries(d.sintomas || {}).filter(([,v]) => v > 0)
      .map(([k,v]) => { const s = (S.cfg.sintomas||[]).find(x => x.id === k);
        return s ? esc(s.nombre) + " (" + NIV_ET[v].toLowerCase() + ")" : ""; })
      .filter(Boolean).join(" · ");
    return `<div class="ex">
      <div class="f num">${fmtFL(f)}</div>
      <div style="flex:0 0 auto;display:grid;place-items:center;width:30px;">
        ${a ? caraSVG(a, 26) : '<span style="color:var(--tx3);">—</span>'}</div>
      <div class="det">${cons || (d.nota ? "" : "sin síntomas")}${
        d.nota ? (cons ? "<br>" : "") + "<i>" + esc(d.nota) + "</i>" : ""}</div>
      <button class="btn-x" data-deldia="${esc(f)}" title="Borrar el día" aria-label="Borrar este día">×</button>
    </div>`;
  }).join("");

  return `<div class="card"><div class="card-h"><h2>Días anotados</h2>
    <span class="sub num">${fs.length}</span></div>${filas}</div>`;
}

/* ===================== vista: Exámenes ===================== */

        <input type="text" id="ex-n" placeholder="Indicación del médico, laboratorio, observaciones…"></div></div>
      <label class="chk"><input type="checkbox" id="ex-mq"> El informe dice «menor a» este valor</label>
      <button class="btn" id="ex-add">Guardar examen</button>
    </div></div>`;

  if(!S.examenes.length)
    return form + `<div class="card"><div class="card-b vacio">Aún no hay exámenes registrados.</div></div>`;

  const lista = S.examenes.map(e => {
    const z = zona(e.valor);
    const det = [ e.dosis ? esc(e.dosis) : "",
                  e.horasDesdeDosis ? e.horasDesdeDosis+" h post dosis" : "",
                  e.nota ? esc(e.nota) : "" ].filter(Boolean).join(" · ");
    return `<div class="ex">
      <div class="f num">${fmtFL(e.fecha)}</div>
      <div class="val num">${e.menorQue ? "&lt;" : ""}${e.valor}</div>
      <span class="pill" data-z="${z}">${zonaTxt(z)}</span>
      <div class="det">${det}</div>
      <button class="btn-x" data-del="${esc(e.id)}" title="Eliminar" aria-label="Eliminar examen">×</button>
    </div>`;
  }).join("");

  return grafico() + `<div class="card">
    <div class="card-h"><h2>Historial</h2>
      <span class="sub num">${S.examenes.length} registro${S.examenes.length>1?"s":""}</span></div>
    ${lista}</div>` + form;
}

/* gráfico: banda del rango terapéutico + línea de valores */
function grafico(){
  const ds = [...S.examenes].reverse();
  if(!ds.length) return "";
  const W=640, H=230, mL=46, mR=16, mT=18, mB=34;
  const iw = W-mL-mR, ih = H-mT-mB;
  const r = S.cfg.rango;
  const yMax = Math.max(r.max*1.25, ...ds.map(d => d.valor)) * 1.05 || 1.5;
  const Y = v => mT + ih - (v/yMax)*ih;
  const X = i => ds.length===1 ? mL+iw/2 : mL + (i/(ds.length-1))*iw;

  let ticks = "";
  const paso = yMax > 2 ? 0.5 : 0.25;
  for(let v=0; v <= yMax+0.0001; v += paso){
    const y = Y(v);
    ticks += `<line x1="${mL}" y1="${y}" x2="${W-mR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`
           + `<text x="${mL-7}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--tx3)">${v.toFixed(2)}</text>`;
  }
  const linea = ds.map((d,i) => (i?"L":"M") + X(i) + "," + Y(d.valor)).join(" ");
  const puntos = ds.map((d,i) => {
    const z = zona(d.valor);
    const c = z==="rango" ? "var(--ok)" : z==="bajo" ? "var(--cr)" : "var(--wa)";
    return `<circle cx="${X(i)}" cy="${Y(d.valor)}" r="${i===ds.length-1?5.5:4}" fill="${c}" stroke="var(--surf)" stroke-width="2"/>`;
  }).join("");
  const fechas = ds.map((d,i) => {
    if(ds.length>6 && i % Math.ceil(ds.length/6) !== 0 && i !== ds.length-1) return "";
    return `<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--tx3)">${fmtF(d.fecha)}</text>`;
  }).join("");
  const u = ds[ds.length-1];
  const etiq = `<text x="${X(ds.length-1)}" y="${Y(u.valor)-12}" text-anchor="${ds.length===1?"middle":"end"}"
      font-size="12.5" font-weight="600" fill="var(--tx)">${u.menorQue?"&lt;":""}${u.valor}</text>`;

  const rango = ds.length===1 ? fmtFL(ds[0].fecha)
              : fmtFL(ds[0].fecha) + " – " + fmtFL(ds[ds.length-1].fecha);

  return `<div class="card">
    <div class="card-h"><h2>Evolución</h2><span class="sub num">${rango} · ${esc(S.cfg.unidad)}</span></div>
    <div class="graf"><svg viewBox="0 0 ${W} ${H}" role="img"
        aria-label="Evolución de los valores respecto al rango terapéutico, ${rango}">
      <rect x="${mL}" y="${Y(r.max)}" width="${iw}" height="${Y(r.min)-Y(r.max)}" fill="var(--ok-soft)"/>
      <line x1="${mL}" y1="${Y(r.max)}" x2="${W-mR}" y2="${Y(r.max)}" stroke="var(--ok)" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="${mL}" y1="${Y(r.min)}" x2="${W-mR}" y2="${Y(r.min)}" stroke="var(--ok)" stroke-width="1" stroke-dasharray="4 3"/>
      ${ticks}
      ${ds.length>1 ? `<path d="${linea}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/>` : ""}
      ${puntos}${etiq}${fechas}
    </svg></div>
    <div class="leg">
      <span><i style="background:var(--ok-soft);border:1px solid var(--ok);"></i>Rango terapéutico ${r.min}–${r.max}</span>
      <span><i style="background:var(--cr);"></i>Bajo</span>
      <span><i style="background:var(--ok);"></i>En rango</span>
      <span><i style="background:var(--wa);"></i>Sobre rango</span>
    </div></div>`;
}

/* ===================== vista: Resumen ===================== */
function textoResumen(){
  const esp = esperadas(), ad = adherencia(14), ad30 = adherencia(30);
  const L = [];
  L.push("RESUMEN PARA LA CONSULTA");
  L.push("Generado el " + fmtFL(hoyISO()));
  if(S.cfg.paciente) L.push("Paciente: " + S.cfg.paciente);
  L.push("");
  L.push("TRATAMIENTO ACTUAL");
  if(esp.length) for(const m of S.cfg.medicamentos)
    L.push("• " + m.nombre + " " + m.dosis + " — " + (m.horarios||[]).join(", "));
  else L.push("• Sin medicamentos registrados");
  L.push("");
  L.push("CUMPLIMIENTO DE LAS TOMAS");
  if(ad)   L.push("• Últimos 14 días: " + ad.hechas + " de " + ad.tot + " tomas (" + ad.pct + "%)");
  if(ad30) L.push("• Últimos 30 días: " + ad30.hechas + " de " + ad30.tot + " tomas (" + ad30.pct + "%)");
  if(!ad)  L.push("• Sin datos suficientes");
  const olv = [];
  for(let i=1; i<=14; i++){
    const r = regsDe(diaISO(i));
    const n = esp.filter(e => r[e.key] && r[e.key].tomada).length;
    if(esp.length && n < esp.length) olv.push(fmtF(diaISO(i)) + (n===0 ? " (ninguna)" : " ("+n+" de "+esp.length+")"));
  }
  if(olv.length) L.push("• Días incompletos: " + olv.join(", "));
  L.push("");
  L.push("CÓMO SE HA SENTIDO (últimos 14 días)");
  {
    const fs = [];
    for(let i=13; i>=0; i--){ const f = diaISO(i); if(S.diario[f]) fs.push(f); }
    if(!fs.length) L.push("• Sin registros en el diario");
    else {
      const con = fs.filter(f => S.diario[f].animo);
      if(con.length){
        const prom = con.reduce((a,f) => a + S.diario[f].animo, 0) / con.length;
        L.push("• Ánimo promedio: " + prom.toFixed(1) + " de 5 (" + con.length + " días anotados)");
        const malos = con.filter(f => S.diario[f].animo <= 2).map(f => fmtF(f));
        if(malos.length) L.push("• Días que se sintió mal o regular: " + malos.join(", "));
      }
      /* síntomas: cuántos días apareció cada uno y su nivel máximo */
      const acum = {};
      for(const f of fs)
        for(const [k,v] of Object.entries(S.diario[f].sintomas || {}))
          if(v > 0){ acum[k] = acum[k] || { dias:0, max:0 }; acum[k].dias++; acum[k].max = Math.max(acum[k].max, v); }
      const ks = Object.keys(acum);
      if(ks.length){
        L.push("• Síntomas registrados:");
        for(const k of ks.sort((a,b) => acum[b].dias - acum[a].dias)){
          const s = (S.cfg.sintomas||[]).find(x => x.id === k);
          L.push("    - " + (s ? s.nombre : k) + ": " + acum[k].dias + " día" + (acum[k].dias>1?"s":"")
                 + ", máximo «" + NIV_ET[acum[k].max] + "»");
        }
      } else L.push("• Sin síntomas marcados");
      const notas = fs.filter(f => S.diario[f].nota);
      if(notas.length){
        L.push("• Notas:");
        for(const f of notas.slice(-5)) L.push("    - " + fmtF(f) + ": " + S.diario[f].nota);
      }
    }
  }
  L.push("");
  L.push("EXÁMENES");
  if(S.examenes.length){
    L.push("Rango de referencia: " + S.cfg.rango.min + " – " + S.cfg.rango.max + " " + S.cfg.unidad);
    for(const e of S.examenes.slice(0,8)){
      let l = "• " + fmtFL(e.fecha) + ": " + (e.menorQue ? "menor a " : "") + e.valor + " " + S.cfg.unidad
            + " (" + zonaTxt(zona(e.valor)) + ")";
      if(e.dosis) l += " · dosis " + e.dosis;
      if(e.horasDesdeDosis) l += " · " + e.horasDesdeDosis + " h post dosis";
      L.push(l);
      if(e.nota) L.push("    " + e.nota);
    }
  } else L.push("• Sin exámenes registrados");
  return L.join("\n");
}

function render(){
  document.getElementById("main").innerHTML =
    (S.vista==="hoy" ? bannerInstalar() : "") +
    (S.vista==="hoy" ? vHoy() : S.vista==="dia" ? vDiario()
     : S.vista==="ex" ? vEx() : S.vista==="res" ? vRes() : vCfg());
  document.getElementById("pac").textContent = S.cfg.paciente || "";
  for(const b of document.querySelectorAll("nav button"))
    b.setAttribute("aria-selected", b.dataset.v === S.vista ? "true" : "false");

/* ===================== acciones ===================== */
async function guardarCfg(parcial){
  S.cfg = { ...S.cfg, ...parcial };
  await idbSet("config", "tratamiento", S.cfg);
  render();
}

async function marcarToma(key){
  const f = hoyISO(), act = regsDe(f), on = act[key] && act[key].tomada;
  const regs = { ...act };
  if(on) delete regs[key];
  else regs[key] = { tomada:true, horaReal:nHoy(), porNombre:S.quien || "" };
  S.tomas[f] = { fecha:f, registros:regs };
  await idbSet("tomas", f, S.tomas[f]);
  render();
}

/* guarda el día del diario; si queda vacío, borra el registro */
async function guardarDiario(f, parcial){
  const act = diaDe(f);
  const d = { ...act, ...parcial, fecha:f, sintomas:{ ...act.sintomas, ...(parcial.sintomas||{}) } };
  /* los síntomas desmarcados salen del objeto, no quedan como undefined */
  for(const k of Object.keys(d.sintomas)) if(typeof d.sintomas[k] !== "number") delete d.sintomas[k];
  const vacio = !d.animo && !d.nota && !Object.keys(d.sintomas).some(k => d.sintomas[k] > 0);
  if(vacio){ delete S.diario[f]; await idbDel("diario", f); }
  else     { S.diario[f] = d;   await idbSet("diario", f, d); }
  render();
}

async function agregarExamen(){
  const v = parseFloat(document.getElementById("ex-v").value);
  if(isNaN(v)){ aviso("Falta el valor del examen"); document.getElementById("ex-v").focus(); return; }
  const ex = {
    id: nuevoId(),
    fecha: document.getElementById("ex-f").value || hoyISO(),
    valor: v,
    menorQue: document.getElementById("ex-mq").checked,
    dosis: document.getElementById("ex-d").value.trim(),
    horasDesdeDosis: document.getElementById("ex-h").value.trim(),
    nota: document.getElementById("ex-n").value.trim(),
    creado: new Date().toISOString()
  };
  await idbSet("examenes", ex.id, ex);
  await cargarExamenes();
  render();
  aviso("Examen guardado");
}

async function cargarExamenes(){
  const vals = await idbVals("examenes");
  S.examenes = vals.sort((a,b) => (b.fecha||"").localeCompare(a.fecha||""));
}

async function exportar(){
  const datos = {
    app: "control-tratamiento", version: 2,
    exportado: new Date().toISOString(),
    config: S.cfg,
    tomas: await (async () => {
      const k = await idbKeys("tomas"), v = await idbVals("tomas"), o = {};
      k.forEach((kk,i) => o[kk] = v[i]); return o;
    })(),
    examenes: await idbVals("examenes"),
    diario: await (async () => {
      const k = await idbKeys("diario"), v = await idbVals("diario"), o = {};
      k.forEach((kk,i) => o[kk] = v[i]); return o;
    })()
  };
  const blob = new Blob([JSON.stringify(datos, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "tratamiento-respaldo-" + hoyISO() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  aviso("Respaldo exportado");
}

async function importar(file){
  let d;
  try { d = JSON.parse(await file.text()); }
  catch(_){ aviso("El archivo no es un respaldo válido"); return; }
  if(!d || d.app !== "control-tratamiento"){ aviso("El archivo no es un respaldo de esta app"); return; }
  if(!confirm("Restaurar el respaldo reemplaza todos los datos de este teléfono. ¿Continuar?")) return;
  for(const s of STORES) await idbClear(s);
  if(d.config) await idbSet("config", "tratamiento", d.config);
  for(const [k,v] of Object.entries(d.tomas || {})) await idbSet("tomas", k, v);
  for(const e of (d.examenes || [])) await idbSet("examenes", e.id || nuevoId(), e);
  for(const [k,v] of Object.entries(d.diario || {})) await idbSet("diario", k, v);
  await cargarTodo();
  render();
  aviso("Respaldo restaurado");
}

/* ===================== recordatorios ===================== */
const NOTI_KEY = "tratamiento-notificado";
function yaNotificado(f, key){
  try {
    const d = JSON.parse(localStorage.getItem(NOTI_KEY) || "{}");
    return d.fecha === f && (d.keys || []).includes(key);
  } catch(_){ return false; }
}
function anotarNotificado(f, key){
  try {
    let d = JSON.parse(localStorage.getItem(NOTI_KEY) || "{}");
    if(d.fecha !== f) d = { fecha:f, keys:[] };
    d.keys.push(key);
    localStorage.setItem(NOTI_KEY, JSON.stringify(d));
  } catch(_){ }
}

async function notificar(titulo, cuerpo){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if(reg) await reg.showNotification(titulo, { body:cuerpo, icon:"./icons/icon-192.png",
      badge:"./icons/icon-192.png", tag:"toma", renotify:true });
    else new Notification(titulo, { body:cuerpo, icon:"./icons/icon-192.png" });
  } catch(_){ }
}

function revisarPendientes(){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const f = hoyISO(), r = regsDe(f), ahora = nHoy();
  for(const e of esperadas()){
    if(e.hora > ahora) continue;                       // todavía no es la hora
    if(r[e.key] && r[e.key].tomada) continue;          // ya está marcada
    if(yaNotificado(f, e.key)) continue;               // ya se avisó hoy
    anotarNotificado(f, e.key);
    notificar("Falta una toma", e.nombre + " " + e.dosis + " — estaba programada a las " + e.hora);
  }
}

async function activarRecordatorios(){
  if(!("Notification" in window)){ aviso("Este navegador no permite avisos"); return; }
  const p = await Notification.requestPermission();
  if(p !== "granted"){ aviso("Los avisos quedaron bloqueados"); return; }
  await guardarCfg({ recordatorios:true });
  try {
    const reg = await navigator.serviceWorker.ready;
    if("periodicSync" in reg){
      const st = await navigator.permissions.query({ name:"periodic-background-sync" });
      if(st.state === "granted") await reg.periodicSync.register("revisa-tomas", { minInterval: 60*60*1000 });
    }
  } catch(_){ }
  revisarPendientes();
  aviso("Recordatorios activados");
}

/* ===================== eventos ===================== */
document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if(!b) return;
  S.vista = b.dataset.v; render(); window.scrollTo(0,0);
});

document.getElementById("b-tema").addEventListener("click", () => {
  const act = document.documentElement.getAttribute("data-theme");
  const oscuroSis = matchMedia("(prefers-color-scheme: dark)").matches;
  const nuevo = act ? (act === "dark" ? "light" : "dark") : (oscuroSis ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", nuevo);
  try { localStorage.setItem("tratamiento-tema", nuevo); } catch(_){ }
});

document.getElementById("fimport").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(f) importar(f);
});

document.getElementById("main").addEventListener("click", async e => {
  const t = e.target;

  const bt = t.closest(".btn-toma");        if(bt){ marcarToma(bt.dataset.k); return; }

  /* ---- diario ---- */
  const ir = t.closest("[data-ir]");
  if(ir){ S.vista = ir.dataset.ir; render(); window.scrollTo(0,0); return; }

  const ba = t.closest("[data-animo]");
  if(ba){
    const n = parseInt(ba.dataset.animo, 10);
    const act = diaDe(hoyISO()).animo;
    await guardarDiario(hoyISO(), { animo: act === n ? null : n });
    return;
  }
  const bs = t.closest("[data-sint]");
  if(bs){
    const id = bs.dataset.sint, n = parseInt(bs.dataset.n, 10);
    const act = diaDe(hoyISO()).sintomas[id];
    await guardarDiario(hoyISO(), { sintomas: { [id]: act === n ? undefined : n } });
    return;
  }
  const dd = t.closest("[data-deldia]");
  if(dd){
    if(!confirm("¿Borrar lo anotado ese día?")) return;
    delete S.diario[dd.dataset.deldia];
    await idbDel("diario", dd.dataset.deldia);
    render(); aviso("Día borrado"); return;
  }
  const ds = t.closest("[data-delsint]");
  if(ds){ guardarCfg({ sintomas: (S.cfg.sintomas||[]).filter(s => s.id !== ds.dataset.delsint) }); return; }

  const del = t.closest("[data-del]");
  if(del){
    if(!confirm("¿Eliminar este examen?")) return;
    await idbDel("examenes", del.dataset.del);
    await cargarExamenes(); render(); aviso("Examen eliminado"); return;
  }
  const dm = t.closest("[data-delmed]");
  if(dm){ guardarCfg({ medicamentos: S.cfg.medicamentos.filter(m => m.id !== dm.dataset.delmed) }); return; }

  switch(t.id){
    case "ex-add": agregarExamen(); break;

    case "d-nota-save":
      await guardarDiario(hoyISO(), { nota: document.getElementById("d-nota").value.trim() });
      aviso("Anotado");
      break;

    case "s-add": {
      const n = document.getElementById("s-n").value.trim();
      if(!n){ aviso("Falta el nombre"); document.getElementById("s-n").focus(); return; }
      guardarCfg({ sintomas: [...(S.cfg.sintomas||[]), { id:"s"+nuevoId(), nombre:n }] });
      aviso("Síntoma agregado");
      break;
    }

    case "m-add": {
      const n = document.getElementById("m-n").value.trim();
      const d = document.getElementById("m-d").value.trim();
      const h = document.getElementById("m-h").value.split(",").map(s => s.trim()).filter(Boolean);
      if(!n){ aviso("Falta el nombre"); document.getElementById("m-n").focus(); return; }
      if(!h.length){ aviso("Falta al menos un horario"); document.getElementById("m-h").focus(); return; }
      if(h.some(x => !/^\d{1,2}:\d{2}$/.test(x))){ aviso("Los horarios van como 09:00"); return; }
      const hh = h.map(x => dosDig(parseInt(x,10)) + ":" + x.split(":")[1]);
      guardarCfg({ medicamentos: [...S.cfg.medicamentos,
        { id:"m"+nuevoId(), nombre:n, dosis:d, horarios:hh }] });
      aviso("Medicamento agregado");
      break;
    }

    case "c-save":
      guardarCfg({
        paciente: document.getElementById("c-p").value.trim(),
        unidad:   document.getElementById("c-u").value.trim() || "mEq/L",
        rango: { min: parseFloat(document.getElementById("c-min").value) || 0,
                 max: parseFloat(document.getElementById("c-max").value) || 0 }
      });
      aviso("Guardado");
      break;

    case "q-save":
      S.quien = document.getElementById("q-n").value.trim();
      try { localStorage.setItem("tratamiento-quien", S.quien); } catch(_){ }
      aviso("Nombre guardado");
      break;

    case "i-add": {
      if(!promptInstalar){ aviso("Tu navegador no ofrece la instalación directa"); return; }
      promptInstalar.prompt();
      const r = await promptInstalar.userChoice;
      promptInstalar = null;
      if(r && r.outcome !== "accepted") aviso("Puedes instalarla después desde Ajustes");
      render();
      break;
    }
    case "i-no":
      try { localStorage.setItem(DESCARTE, "1"); } catch(_){ }
      render();
      break;

    case "n-act":  activarRecordatorios(); break;
    case "n-test": notificar("Aviso de prueba", "Así se verá el recordatorio de una toma."); break;

    case "r-exp": exportar(); break;
    case "r-imp": document.getElementById("fimport").click(); break;
    case "r-del":
      if(!confirm("Esto borra medicamentos, tomas, diario y exámenes de este teléfono. ¿Seguro?")) return;
      if(!confirm("Última confirmación: se borra todo y no se puede deshacer.")) return;
      for(const s of STORES) await idbClear(s);
      S.cfg = { ...CFG_DEF, sintomas:[...SINT_DEF] }; S.tomas = {}; S.examenes = []; S.diario = {};
      render(); aviso("Datos borrados");
      break;

    case "res-copy": {
      const txt = document.getElementById("res-txt").textContent;
      try { await navigator.clipboard.writeText(txt); aviso("Resumen copiado"); }
      catch(_){ aviso("No se pudo copiar"); }
      break;
    }
    case "res-share": {
      const txt = document.getElementById("res-txt").textContent;
      if(navigator.share){
        try { await navigator.share({ title:"Resumen de tratamiento", text:txt }); }
        catch(_){ }
      } else {
        try { await navigator.clipboard.writeText(txt); aviso("Copiado: pégalo en el correo"); }
        catch(_){ aviso("Copia el texto a mano"); }
      }
      break;
    }
  }
});

/* ===================== arranque ===================== */
async function cargarTodo(){
  const cfg = await idbGet("config", "tratamiento");
  S.cfg = cfg ? { ...CFG_DEF, ...cfg } : { ...CFG_DEF };
  if(!Array.isArray(S.cfg.sintomas)) S.cfg.sintomas = [...SINT_DEF];
  const k = await idbKeys("tomas"), v = await idbVals("tomas");
  S.tomas = {}; k.forEach((kk,i) => S.tomas[kk] = v[i]);
  const kd = await idbKeys("diario"), vd = await idbVals("diario");
  S.diario = {}; kd.forEach((kk,i) => S.diario[kk] = vd[i]);
  await cargarExamenes();
}

(async () => {
  try { const t = localStorage.getItem("tratamiento-tema");
        if(t) document.documentElement.setAttribute("data-theme", t);
        S.quien = localStorage.getItem("tratamiento-quien") || ""; } catch(_){ }

  try {
    _db = await abrirDB();
    await cargarTodo();
  } catch(err){
    render();
    aviso("No se pudo abrir el almacenamiento del navegador");
    return;
  }
  S.listo = true;
  render();
  revisarPendientes();
  setInterval(revisarPendientes, 60000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden){ render(); revisarPendientes(); } });

  if("serviceWorker" in navigator){
    try { await navigator.serviceWorker.register("./sw.js"); } catch(_){ }
  }
})();
</script>
